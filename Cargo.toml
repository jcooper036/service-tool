[package]
name = "service-tool"
version = "0.1.0"
edition = "2024"

[lib]
name = "service_tool"
path = "src/lib.rs"

[[bin]]
name = "ser"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "8.0.1"
dirs = "7.0.0"
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
